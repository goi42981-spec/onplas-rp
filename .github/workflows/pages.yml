name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build static site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          bunx vite build --config vite.pages.config.ts
          # The prebuilt bundle uses absolute /onplas-rp/ paths; point them at the repo subfolder.
          find dist-pages/onplas-rp -type f \( -name '*.js' -o -name '*.css' \) \
            -exec sed -i "s#/onplas-rp/#${PAGES_BASE}onplas-rp/#g" {} +
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
